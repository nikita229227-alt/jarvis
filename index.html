<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jarvis</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background: radial-gradient(circle at 50% 25%, #0a1a2f 0%, #000 80%);
    color: #7df9ff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 15px; user-select: none;
  }
  h1 { font-size: 20px; letter-spacing: 8px; text-transform: uppercase; font-weight: 300; margin-top: 5px; text-shadow: 0 0 18px #00e5ff; flex-shrink: 0; }
  #status { font-size: 14px; text-align: center; min-height: 44px; padding: 8px 12px; margin: 8px 0; color: #b5f5ff; flex-shrink: 0; }
  #log { flex: 1; width: 100%; max-width: 500px; overflow-y: auto; font-size: 13px; padding: 8px; color: #6ad1e3; line-height: 1.5; min-height: 40px; }
  #log div { margin-bottom: 8px; border-left: 2px solid #007a99; padding-left: 8px; word-wrap: break-word; }
  #log .user { color: #ffd166; border-color: #ffd166; }
  #log .jarvis { color: #7df9ff; border-color: #7df9ff; }

  #permBtn {
    padding: 10px 22px; border-radius: 30px; border: 1px solid #00e5ff;
    background: rgba(0,229,255,0.12); color: #7df9ff; font-size: 13px;
    font-weight: 600; letter-spacing: 1px; cursor: pointer; margin: 6px 0; transition: all 0.2s ease; flex-shrink: 0;
  }
  #permBtn:active { transform: scale(0.96); }
  #permBtn.granted { border-color: #39ff8f; color: #39ff8f; background: rgba(57,255,143,0.12); cursor: default; }

  #mic {
    width: 120px; height: 120px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 40% 35%, #00e5ff 0%, #004e66 60%, #001f2b 100%);
    box-shadow: 0 0 30px #00e5ff88, inset 0 0 20px #000; color: #fff;
    font-size: 46px; cursor: pointer; transition: all 0.25s ease; margin: 8px 0;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #mic:active { transform: scale(0.93); }
  #mic:disabled { opacity: 0.35; box-shadow: none; }
  #mic.listening { animation: pulse 1.1s infinite; background: radial-gradient(circle at 40% 35%, #ff3b6b 0%, #8b0030 60%, #2b0010 100%); box-shadow: 0 0 45px #ff3b6baa; }
  #mic.speaking { background: radial-gradient(circle at 40% 35%, #ffd166 0%, #996600 60%, #332200 100%); box-shadow: 0 0 45px #ffd166aa; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 25px #ff3b6b; } 50% { box-shadow: 0 0 65px #ff3b6b, 0 0 110px #ff3b6b55; } }
  .hint { font-size: 10px; opacity: 0.45; text-align: center; padding: 0 10px; flex-shrink: 0; }
</style>
</head>
<body>

<h1>J A R V I S</h1>
<div id="status">Нажми «Разрешить голос»</div>
<button id="permBtn">🎤 Разрешить голос</button>
<div id="log"></div>
<button id="mic" disabled>🎙️</button>
<div class="hint">«открой ютуб» · «который час» · «найди погоду» · «скажи привет»</div>

<script>
const mic = document.getElementById('mic');
const permBtn = document.getElementById('permBtn');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

let isListening = false;
let isProcessing = false;
let recognition = null;
let permGranted = false;
let chosenVoice = null;

function setStatus(t) { statusEl.textContent = t; }
function log(text, who) {
  const d = document.createElement('div');
  d.className = who;
  d.textContent = (who === 'user' ? '🗣️ ' : '🤖 ') + text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

// ГОЛОС
function pickJarvisVoice() {
  if (!window.speechSynthesis) return;
  const voices = speechSynthesis.getVoices();
  const ru = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
  if (ru.length) chosenVoice = ru.find(v => /Dmitry|Pavel|Standard-D|Wavenet-D/i.test(v.name)) || ru[0];
}
if (window.speechSynthesis) {
  pickJarvisVoice();
  speechSynthesis.onvoiceschanged = pickJarvisVoice;
}
function speak(text) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ru-RU'; u.rate = 0.92; u.pitch = 0.75;
    if (chosenVoice) u.voice = chosenVoice;
    mic.classList.add('speaking');
    u.onend = () => { mic.classList.remove('speaking'); resolve(); };
    u.onerror = () => { mic.classList.remove('speaking'); resolve(); };
    speechSynthesis.speak(u);
  });
}

// РАЗРЕШЕНИЕ
permBtn.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach(t => t.stop());
    permGranted = true;
    permBtn.textContent = '✅ Голос разрешён';
    permBtn.classList.add('granted');
    permBtn.disabled = true;
    mic.disabled = false;
    setStatus('Готов. Нажми на микрофон.');
  } catch (err) {
    setStatus('❌ Ошибка доступа. Разреши микрофон в настройках сайта.');
  }
});

// РАСПОЗНАВАНИЕ
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    mic.classList.add('listening');
    mic.textContent = '⏹️';
    setStatus('🎤 Слушаю...');
  };

  recognition.onresult = async (e) => {
    const text = (e.results[0][0].transcript || '').trim().toLowerCase();
    if (!text) return;
    log(text, 'user');
    isProcessing = true;
    setStatus('🤔 Думаю...');
    await handleCommand(text);
  };

  recognition.onerror = (e) => {
    if (e.error !== 'no-speech' && e.error !== 'aborted') {
      setStatus('Ошибка: ' + e.error);
    }
    if (e.error === 'not-allowed') permGranted = false;
  };

  recognition.onend = () => {
    isListening = false;
    mic.classList.remove('listening');
    mic.textContent = '🎙️';
    if (!isProcessing) {
      setStatus('Нажми на микрофон и говори');
    }
  };
}

mic.addEventListener('click', () => {
  if (isProcessing || !permGranted) return;
  if (window.speechSynthesis && speechSynthesis.speaking) {
    speechSynthesis.cancel();
    mic.classList.remove('speaking');
    return;
  }
  if (isListening) {
    recognition.stop();
    return;
  }
  setStatus('Готовлю микрофон...');
  try { recognition.start(); } catch(e) {}
});

// КОМАНДЫ
async function handleCommand(cmd) {
  const c = cmd.replace(/[.,!?]/g, ' ').replace(/\s+/g, ' ').trim();
  let reply = '';

  if (/котор(ый|ое) час|сколько времени|время/.test(c)) {
    const n = new Date();
    reply = `Сейчас ${n.getHours()} часов ${n.getMinutes()} минут`;
  }
  else if (/привет|здравствуй|хай/.test(c)) {
    reply = 'Приветствую, сэр. Все системы в норме.';
  }
  else if (/кто ты/.test(c)) {
    reply = 'Я Джарвис, ваш голосовой ассистент.';
  }
  else if (/открой|запусти/.test(c)) {
    const sites = {'ютуб':'https://youtube.com','youtube':'https://youtube.com','вк':'https://vk.com','телеграм':'https://web.telegram.org','гугл':'https://google.com','яндекс':'https://ya.ru','погода':'https://yandex.ru/pogoda'};
    let opened = false;
    for (const key in sites) {
      if (c.includes(key)) { window.open(sites[key], '_blank'); reply = `Открываю ${key}`; opened = true; break; }
    }
    if (!opened) reply = 'Не знаю такой сайт.';
  }
  else if (/найди|загугли|поищи/.test(c)) {
    const q = c.replace(/найди|загугли|поищи|в интернете|в гугле/g,'').trim();
    if (q) { window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank'); reply = `Ищу ${q}`; }
    else reply = 'Что искать?';
  }
  else if (/стоп|хватит|замолчи/.test(c)) {
    speechSynthesis.cancel();
    reply = 'Молчу';
  }
  else if (/скажи|повтори/.test(c)) {
    reply = c.replace(/скажи|повтори/g,'').trim() || 'Что сказать?';
  }
  else {
    window.open('https://www.google.com/search?q=' + encodeURIComponent(c), '_blank');
    reply = 'Не понял. Открыл поиск.';
  }

  log(reply, 'jarvis');
  setStatus(reply);
  await speak(reply);

  isProcessing = false;
  setStatus('Нажми на микрофон и говори');
}
</script>
</body>
  </html>
